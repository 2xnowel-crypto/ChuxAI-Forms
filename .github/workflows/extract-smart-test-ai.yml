name: Extract Smart Test AI 3.2.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ChuxAI GoogleForms/smart-test-ai-3.2.2.zip'
      - '.github/workflows/extract-smart-test-ai.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract original extension files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src
          unzip -o "ChuxAI GoogleForms/smart-test-ai-3.2.2.zip" -d /tmp/smart-test-ai
          cp /tmp/smart-test-ai/smart-test-ai-3.2.2/manifest.json src/manifest.json
          cp /tmp/smart-test-ai/smart-test-ai-3.2.2/background.js src/background.js
          cp /tmp/smart-test-ai/smart-test-ai-3.2.2/content.js src/content.js
          cp /tmp/smart-test-ai/smart-test-ai-3.2.2/style.css src/style.css
          cp /tmp/smart-test-ai/smart-test-ai-3.2.2/LEEME.txt src/LEEME.txt
          test -s src/manifest.json
          test -s src/background.js
          test -s src/content.js
          test -s src/style.css
          test -s src/LEEME.txt
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/
          if ! git diff --cached --quiet; then
            git commit -m "Add original Smart Test AI 3.2.2 source files"
            git push
          fi
